      <Card><p className="mono text-[10px] tracking-widest text-white/40">{t('contacts.hoursL')}</p><p className="mono mt-1 text-xs text-white/60">{t('contacts.hours')}</p></Card></div>}</div>)}

/* ================= CHECKOUT ================= */
function Checkout(){const{t,lang,items,total,order,setOrder,tm,clear}=useApp();
  const[step,setStep]=useState(0),[code,setCode]=useState(''),[err,setErr]=useState('');
  const hasCash=items.some(i=>i.type==='cash'),hasPp=items.some(i=>i.type==='paypal');
  const s=order.sh;const setS=p=>setOrder(o=>({...o,sh:{...o.sh,...p}}));
  const fin=order.method==='bonifico'?total*1.1:order.method==='amazon'?total*1.2:total;
  const ppOk=order.pp1&&order.pp2&&order.pp1.trim().toLowerCase()===order.pp2.trim().toLowerCase();
  const usdt=(fin*1.15).toFixed(2);
  const buildMsg=()=>['🟢 NUOVO ORDINE — GUSTAVOEURO','────────────────','',...items.map(i=>`• ${i.name} × ${i.qty} = ${money(i.unit*i.qty,lang)}`),'','────────────────',`TOTALE: ${money(fin,lang)}`,`METODO: ${order.method}`,'────────────────',hasCash?'📦 SPEDIZIONE':'',hasCash?`Via: ${s.addr} ${s.num}`:'',hasCash?`CAP/Città: ${s.zip} ${s.city}`:'',hasCash?`Email: ${s.email}`:'',hasCash?`Tel: ${s.pre} ${s.phone}`:'',hasCash?`Corriere: ${s.cour}${s.locker?' — Locker: '+s.locker:''}`:'',hasPp?'📧 PAYPAL (destinatario)':'',hasPp?order.pp1:'','────────────────',`CODICE: ${code}`].filter(Boolean).join('\n');
  const confirm=()=>{const c=oid();setCode(c);setTimeout(()=>{const msg=buildMsg().replace('CODICE: '+code,'CODICE: '+c);if(navigator.clipboard)navigator.clipboard.writeText(msg).catch(()=>{});tm('Testo copiato ✓');setStep(4)},60)};
  if(items.length===0&&step<4)return(<div className="mx-auto max-w-2xl px-4 pt-10 a-acid"><Back/><Card cls="mt-6 text-center"><p className="mono text-sm text-white/60">Carrello vuoto</p><div className="mt-4 flex justify-center gap-2"><a href="#/cash"><Btn v="o">Banconote</Btn></a><a href="#/paypal"><Btn>Trasferimenti</Btn></a></div></Card></div>);
  const sm={'POSTE ITALIANE':'p','BRT':'b','GLS':'g','DHL':'d','LOCKER INPOST':'l'};
  return(<div className="mx-auto max-w-3xl px-4 pt-6 a-acid">
    <div className="mb-4 flex items-center justify-between"><Back to="/node"/><span className="mono flex items-center gap-1.5 text-[10px] tracking-[.2em] text-aqua"><span className="h-1.5 w-1.5 rounded-full bg-aqua pulse"/>🔒 {t('checkout.sec')}</span></div>
    <div className="mb-5 flex items-center gap-2">{t('checkout.steps').map((st,i)=>(<div key={st} className="flex flex-1 items-center gap-2">
      <div className={cx('flex h-6 w-6 items-center justify-center rounded-full mono text-[10px]',i<=step?'bg-acid text-black':'border border-line text-white/35')}>{i+1}</div>
      <span className={cx('mono hidden text-[9px] tracking-widest sm:inline',i<=step?'text-acid':'text-white/30')}>{st}</span>
      {i<3&&<div className={cx('h-px flex-1',i<step?'bg-acid/50':'bg-line')}/>}</div>))}</div>

    {step===0&&<div className="space-y-4">
      <Card cls="relative text-center"><Brk/>
        <h1 className="text-xl font-bold text-white">{t('checkout.g.0')}</h1>
        <p className="mono mt-2 text-[10px] tracking-widest text-white/40">{t('checkout.g.1')}</p>
        <p className="mt-2 text-xs text-white/45">{t('checkout.gNote')}</p>
        <div className="mt-5 space-y-3"><Btn cls="w-full" onClick={()=>setStep(1)}>{t('checkout.g.2')}</Btn>
          <a href={isMob()&&/Android/i.test(navigator.userAgent)?'https://play.google.com/store/apps/details?id=org.telegram.messenger':'https://apps.apple.com/app/telegram-messenger/id686449807'} target="_blank" rel="noreferrer"><Btn v="o" cls="w-full">{t('checkout.g.3')}</Btn></a></div></Card>

      {hasPp&&<Card cls="a-aqua"><h2 className="font-bold text-white">{t('checkout.ppT')}</h2>
        <p className="mono mt-1 text-[10px] tracking-widest text-white/40">{t('checkout.ppL')}</p>
        <div className="mt-4 space-y-3">
          <input className="inp" placeholder="email@esempio.com" value={order.pp1} onChange={e=>setOrder(o=>({...o,pp1:e.target.value}))}/>
          <input className="inp" placeholder={t('checkout.pp2')} value={order.pp2} onChange={e=>setOrder(o=>({...o,pp2:e.target.value}))}/>
          <p className="mono text-[10px] text-gold">⚠ {t('checkout.ppWarn')}</p>
          {order.pp2&&<p className={cx('mono text-[11px]',ppOk?'text-acid':'text-pink')}>{ppOk?'✓ '+t('checkout.ppOk'):'✕ '+t('checkout.ppErr')}</p>}
          <p className="text-xs text-white/45">{t('checkout.ppNote')}</p></div></Card>}

      {hasCash&&<Card><h2 className="font-bold text-white">{t('checkout.shipT')}</h2>
        <p className="mono mt-1 text-[10px] tracking-widest text-white/40">{t('checkout.shipNote')}</p>
        <div className="mt-4 space-y-3">
          <div className="grid grid-cols-3 gap-2"><input className="inp col-span-2" placeholder={t('checkout.street')} value={s.addr} onChange={e=>setS({addr:e.target.value})}/><input className="inp" placeholder={t('checkout.num')} value={s.num} onChange={e=>setS({num:e.target.value})}/></div>
          <div className="grid grid-cols-3 gap-2"><input className="inp" placeholder={t('checkout.zip')} value={s.zip} onChange={e=>setS({zip:e.target.value})}/><input className="inp col-span-2" placeholder={t('checkout.city')} value={s.city} onChange={e=>setS({city:e.target.value})}/></div>
          <input className="inp" placeholder={t('checkout.email')} value={s.email} onChange={e=>setS({email:e.target.value})}/>
          <div className="flex gap-2"><select className="inp w-24" value={s.pre} onChange={e=>setS({pre:e.target.value})}>{PREFIXES.map(p=><option key={p}>{p}</option>)}</select><input className="inp" placeholder={t('checkout.phone')} value={s.phone} onChange={e=>setS({phone:e.target.value})}/></div>
          <div className="grid gap-2 sm:grid-cols-2">{SHIPPERS.map(c=><button key={c} onClick={()=>setS({cour:c})} className={cx('rounded-lg border p-3 text-left transition-all',s.cour===c?'border-acid/70 bg-acid/10':'border-line hover:border-white/30')}><p className="mono text-xs text-white">{c}</p><p className="mono text-[9px] text-white/35">{t('checkout.sh.'+sm[c])[0]} · {t('checkout.sh.'+sm[c])[1]}</p></button>)}</div>
          {s.cour==='LOCKER INPOST'&&<input className="inp" placeholder={t('checkout.locker')} value={s.locker} onChange={e=>setS({locker:e.target.value})}/>}</div></Card>}

      {err&&<p className="mono text-xs text-pink">{err}</p>}
      <Btn cls="w-full" onClick={()=>{if(hasCash&&(!s.addr||!s.num||!s.zip||!s.city||!s.email||!s.phone||!s.cour)){setErr(t('checkout.fill'));return}if(hasPp&&!ppOk){setErr(t('checkout.ppErr'));return}setErr('');setStep(1)}}>{t('checkout.go')}</Btn>
    </div>}

    {step===1&&<div className="space-y-4">
      <Card><p className="eyebrow">{t('checkout.sum')}</p>
        <div className="mt-3 space-y-2">{items.map(i=><div key={i.id} className="flex justify-between text-sm"><span className="text-white/60">{i.name} × {i.qty}</span><span className="mono text-white">{money(i.unit*i.qty,lang)}</span></div>)}</div>
        <div className="mt-3 flex justify-between border-t border-line pt-3"><span className="mono text-xs uppercase tracking-widest text-white/50">{t('checkout.tot')}</span><span className="mono text-lg text-acid">{money(total,lang)}</span></div></Card>
      {hasCash&&<Card cls="a-acid"><p className="mono text-[10px] tracking-widest text-white/40">📦 SPEDIZIONE</p><p className="mt-1 text-sm text-white/70">{s.addr} {s.num}, {s.zip} {s.city}</p><p className="mono text-[11px] text-white/45">{s.email} · {s.pre} {s.phone} · {s.cour}</p></Card>}
      {hasPp&&<Card cls="a-aqua"><p className="mono text-[10px] tracking-widest text-white/40">📧 PAYPAL</p><p className="mt-1 mono text-sm text-white/70">{order.pp1}</p><p className="mono text-[10px] text-acid">✓ {t('checkout.ppOk')}</p></Card>}
      <div className="flex gap-2"><Btn v="o" onClick={()=>setStep(0)}>←</Btn><Btn cls="flex-1" onClick={()=>setStep(2)}>{t('checkout.go')}</Btn></div>
    </div>}

    {step===2&&<div className="space-y-4">
      <Card><h2 className="font-bold text-white">{t('checkout.s2')}</h2><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.sub2')}</p>
        <div className="mt-4 space-y-3">
          <button onClick={()=>{setOrder(o=>({...o,method:'crypto'}))}} className={cx('w-full rounded-xl border p-4 text-left transition-all',order.method==='crypto'?'border-aqua/70 bg-aqua/10':'border-line hover:border-white/30')}>
            <div className="flex items-center justify-between"><span className="mono text-sm text-white">{t('checkout.crypto')}</span><span className="badge">{t('checkout.nofee')}</span></div>
            <p className="mono mt-1 text-[10px] text-white/40">{t('checkout.csub')}</p><p className="mono mt-1 text-[9px] text-aqua">{t('checkout.cbadge')}</p></button>
          <button onClick={()=>{setOrder(o=>({...o,method:'bonifico'}))}} className={cx('w-full rounded-xl border p-4 text-left transition-all',order.method==='bonifico'?'border-violet/70 bg-violet/10':'border-line hover:border-white/30')}>
            <div className="flex items-center justify-between"><span className="mono text-sm text-white">{t('checkout.bon')}</span><span className="badge">{t('checkout.bfee')}</span></div>
            <p className="mono mt-1 text-[10px] text-white/40">{t('checkout.bsub')}</p></button>
          <button onClick={()=>{setOrder(o=>({...o,method:'amazon'}))}} className={cx('w-full rounded-xl border p-4 text-left transition-all',order.method==='amazon'?'border-gold/70 bg-gold/10':'border-line hover:border-white/30')}>
            <div className="flex items-center justify-between"><span className="mono text-sm text-white">{t('checkout.amz')}</span><span className="badge">{t('checkout.afee')}</span></div>
            <p className="mono mt-1 text-[10px] text-white/40">{t('checkout.asub')}</p></button></div></Card>

      {order.method==='crypto'&&<Card cls="a-aqua"><h3 className="font-bold text-white">{t('checkout.cq.0')}</h3><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.cq.1')}</p>
        <p className="mono mt-3 text-[10px] tracking-widest text-white/40">{t('checkout.net')}</p>
        <div className="mt-2 flex gap-2">{['USDT','BTC','LTC'].map(n=><button key={n} onClick={()=>setOrder(o=>({...o,coin:n}))} className={cx('flex-1 rounded-lg border p-3 mono text-xs',order.coin===n?'border-aqua/70 bg-aqua/10 text-aqua':'border-line text-white/60')}>{n}</button>)}</div>
        {order.coin&&<div className="mt-3 rounded-lg border border-line bg-black/40 p-3"><p className="mono text-[9px] tracking-widest text-white/40">{t('checkout.send')}</p>
          <p className="mono mt-1 text-lg font-bold text-aqua">{order.coin==='USDT'?usdt+' USDT':money(fin,lang)}</p>
          <p className="mono text-[9px] tracking-widest text-white/40 mt-2">ADDRESS</p>
          <p className="mono break-all text-xs text-aqua">{WALLETS[order.coin]}</p>
          <button onClick={async()=>{await cp(WALLETS[order.coin]);tm('Copiato')}} className="mono mt-2 text-[10px] uppercase tracking-widest text-white/45 hover:text-aqua">{t('c.copy')}</button></div>}</Card>}

      {order.method==='amazon'&&<Card cls="a-gold"><h3 className="font-bold text-white">{t('checkout.aq.0')}</h3><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.aq.1')}</p>
        <input className="inp mt-3" placeholder="XXXX-XXXX-XXXX-XXX" onChange={e=>setOrder(o=>({...o,voucher:e.target.value.toUpperCase()}))}/></Card>}

      {order.method&&<Card><div className="space-y-1 border-t border-line pt-3">
        <div className="flex justify-between text-sm"><span className="text-white/50">{t('checkout.sub')}</span><span className="mono text-white">{money(total,lang)}</span></div>
        {order.method==='bonifico'&&<div className="flex justify-between text-sm"><span className="text-white/50">{t('checkout.bfeeL')}</span><span className="mono text-white">+{money(total*.1,lang)}</span></div>}
        {order.method==='amazon'&&<div className="flex justify-between text-sm"><span className="text-white/50">{t('checkout.vfeeL')}</span><span className="mono text-white">+{money(total*.2,lang)}</span></div>}
        <div className="flex justify-between pt-2"><span className="mono text-xs uppercase tracking-widest text-white/50">{t('checkout.pay')}</span><span className="mono text-lg font-bold text-acid">{money(fin,lang)}</span></div></div>
        <div className="mt-3 flex gap-2"><Btn v="o" onClick={()=>setStep(1)}>←</Btn><Btn cls="flex-1" onClick={confirm} disabled={order.method==='crypto'&&!order.coin}>{t('checkout.conf')}</Btn></div></Card>}
    </div>}

    {step===4&&<Card cls="relative text-center"><Brk/>
      <div className="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-acid/15 text-2xl text-acid">✓</div>
      <h1 className="text-xl font-bold text-white">{t('checkout.done')}</h1><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.doneS')}</p>
      <div className="mt-4 rounded-xl border border-acid/30 bg-acid/5 p-4"><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.code')}</p><p className="mono mt-1 text-2xl font-bold tracking-widest text-acid">{code}</p>
        <button onClick={async()=>{await cp(code);tm('Copiato')}} className="mono mt-2 text-[10px] uppercase tracking-widest text-white/45 hover:text-acid">{t('checkout.cc')}</button></div>
      <p className="mt-4 text-xs text-white/45">{t('checkout.warn')}</p>
      <div className="mt-4 flex flex-wrap justify-center gap-2"><a href={TG+'?text='+encodeURIComponent(buildMsg())} target="_blank" rel="noreferrer"><Btn>{t('checkout.ct')}</Btn></a><Btn v="o" onClick={()=>{clear();nav('/node')}}>{t('checkout.back')}</Btn></div></Card>}
  </div>)}

/* ================= APP ================= */
function Router(){const p=useRoute();const seg=p.split('/').filter(Boolean);const r=seg[0];
  if(!r)return <Gate/>;
  if(r==='gate')return <Gate/>;
  if(!sessionStorage.getItem('ge-in'))return <Gate/>;
  let page;
  if(r==='node')page=<Node_/>;else if(r==='cash')page=<Cash/>;else if(r==='paypal')page=<Paypal/>;
  else if(r==='quality')page=<Quality/>;else if(r==='feedback')page=<Feedback/>;else if(r==='faq')page=<Faq/>;
  else if(r==='bot')page=<Bot/>;else if(r==='track')page=<Track/>;
  else if(r==='about')page=<Info k="about" acc="a-acid"/>;else if(r==='how')page=<Info k="how" acc="a-aqua"/>;
  else if(r==='security')page=<Info k="security" acc="a-violet"/>;else if(r==='shipping')page=<Info k="shipping" acc="a-gold"/>;
  else if(r==='refunds')page=<Info k="refunds" acc="a-pink"/>;else if(r==='contacts')page=<Info k="contacts" acc="a-aqua"/>;
  else if(r==='privacy'||r==='terms'||r==='cookies')page=<Legal doc={r}/>;
  else if(r==='checkout')page=<Checkout/>;else page=<Node_/>;
  return(<><Header/>{page}<Footer/><Cart/></>)}
function Toast(){const{toast}=useApp();if(!toast)return null;
  return <div className="pop fixed bottom-6 left-1/2 z-[100] -translate-x-1/2 rounded-full border border-acid/50 bg-surface/95 px-5 py-2.5 mono text-[11px] uppercase tracking-widest text-acid backdrop-blur-xl">{toast}</div>}
function Fab(){return <a href={TG_BOT} target="_blank" rel="noreferrer" aria-label="Telegram Bot" className="fixed bottom-6 right-5 z-[80] flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-acid to-aqua text-black shadow-[0_10px_34px_-8px_rgba(200,255,0,.9)] transition-transform hover:scale-105"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.6 20c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.1 1.4 11.6c-1-.3-1-1 .2-1.5l19-7.3c.9-.3 1.6.2 1.3 1.5z"/></svg></a>}
function App(){return(<Prov><Router/><Toast/><Fab/></Prov>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
